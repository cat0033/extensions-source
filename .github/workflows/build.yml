name: Build Single Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bakamh APK
        run: |
          chmod +x gradlew
          ./gradlew :src:zh:bakamh:assembleDebug -x spotlessCheck -x spotlessKotlinCheck -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakamh-apk
          path: "**/*.apk"
